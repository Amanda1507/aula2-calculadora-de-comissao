<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Comissão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <form action="">
            <section class="corpo">
                <h1>Calculadora de Comissão</h1>
        
                <div>
                    <label for="input">Nome do Vendedor(a): </label>
                    <input type="text" placeholder="Digite seu nome:">
                    <br> <br>
                    <label for="input">Quantidade de vendas: </label>
                    <input type="text" placeholder="Digite o valor de vendas:">
                    <br><br>
                    <button type="button">Calcular Salário</button>
                </div>

            </section>
        </form>
    </main>
</body>
</html>
